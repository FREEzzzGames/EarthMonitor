name: EarthMonitor Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: earthmonitor-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/earth-monitor-smoke.mjs
      - name: Validate inline dashboard JavaScript
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import vm from 'node:vm';
          const html = readFileSync('index.html', 'utf8');
          const script = readFileSync('app.js', 'utf8');
          const css = readFileSync('styles.css', 'utf8');
          if (!html.includes('src="./app.js"')) throw new Error('External dashboard script link missing');
          if (!html.includes('href="./styles.css"')) throw new Error('External dashboard stylesheet link missing');
          if (!css.includes('.details-dialog')) throw new Error('Drill-down modal styles missing');
          new vm.Script(script, { filename: 'app.js' });
          console.log('External dashboard JavaScript and stylesheet validated.');
          NODE
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage website
        run: |
          mkdir -p _site
          cp index.html styles.css app.js .nojekyll _site/\n          cp -R js _site/js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
